<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vista previa — Carta de descarte</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /* Solo layout de esta página. Edita el estilo en index.css (.card, #discardPile, etc.) */
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        body.card-preview-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background:
                radial-gradient(at 20% 20%, hsla(253, 50%, 18%, 0.55) 0px, transparent 50%),
                radial-gradient(at 80% 80%, hsla(225, 40%, 14%, 0.6) 0px, transparent 50%),
                var(--bg-main);
        }

        .preview-hint {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            z-index: 2;
            pointer-events: none;
            max-width: min(92vw, 36rem);
            line-height: 1.4;
        }

        .preview-hint code {
            color: var(--color-accent-hover);
        }

        .preview-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Misma jerarquía que en el juego: .pile-container > #discardPile > .card */
        .preview-stage .pile-container {
            transform: scale(4.5);
            transform-origin: center center;
        }

        .preview-stage #discardPile .card {
            cursor: default;
        }

        .preview-stage #discardPile .card:hover {
            transform: none;
        }
    </style>
</head>
<body class="card-preview-page">
    <p class="preview-hint">
        Carta de <strong>descarte</strong>. Edita <code>index.css</code>
        (<code>.card</code>, <code>.card-value</code>, <code>#discardPile</code>, etc.) y recarga.
    </p>

    <div class="preview-stage">
        <div class="pile-container">
            <span class="pile-label">Descarte</span>
            <div id="discardPile">
                <div class="card black" data-id="preview-discard">
                    <div class="card-top">
                        <span class="card-value">6</span>
                        <span class="card-suit-mini" title="♠">
                            <svg class="suit-svg" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2C8.6 7.2 4.5 11.2 4.5 15a4.4 4.4 0 0 0 7.15 3.45V21H9.2v1.6h5.6V21h-2.45v-2.55A4.4 4.4 0 0 0 19.5 15c0-3.8-4.1-7.8-7.5-13z"/></svg>
                        </span>
                    </div>
                </div>
            </div>
            <span class="pile-count">9</span>
        </div>
    </div>
</body>
</html>
